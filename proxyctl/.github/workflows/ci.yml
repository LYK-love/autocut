name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run checks
        run: make check
